{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review workspace — Clinical Knowledge Platform</title>
<link rel="stylesheet" href="{% static 'core/workspace.css' %}">
</head>
<body>
<main class="ws-layout">
  <section class="ws-upper" aria-label="Records">
    <div class="ws-tabs" role="tablist" aria-label="Record types">
      <button type="button" role="tab" data-tab="claim-groups" aria-selected="true">ClaimGroups</button>
      <button type="button" role="tab" data-tab="claims" aria-selected="false">Claims</button>
      <button type="button" role="tab" data-tab="diseases" aria-selected="false">Diseases</button>
      <button type="button" role="tab" data-tab="interventions" aria-selected="false">Interventions</button>
      <button type="button" role="tab" data-tab="ners" aria-selected="false">NERs</button>
      <button type="button" role="tab" data-tab="trials" aria-selected="false">Trials</button>
      <button type="button" role="tab" data-tab="publications" aria-selected="false">Publications</button>
      <button type="button" role="tab" data-tab="sources" aria-selected="false">Sources</button>
      <button type="button" role="tab" data-tab="focuses" aria-selected="false">Focuses</button>
    </div>
    <form id="ws-source-search" class="ws-source-search" hidden>
      <label for="ws-source-query">Keyword</label>
      <input id="ws-source-query" type="search" name="query" required maxlength="500" placeholder="Search external sources">
      <label><input type="radio" name="kind" value="publications" checked> Publications</label>
      <label><input type="radio" name="kind" value="trials"> Trials</label>
      <button class="ws-btn ws-btn-primary" type="submit">Search sources</button>
    </form>
    <div class="ws-controls">
      <label class="ws-search-label" for="ws-search">Search</label>
      <input id="ws-search" class="ws-search" type="search" name="search" placeholder="Search…" autocomplete="off">
      <div id="ws-filters" class="ws-filters" aria-label="Filters"></div>
    </div>
    <div class="ws-table-wrap">
      <table class="ws-table">
        <thead id="ws-thead"></thead>
        <tbody id="ws-tbody"></tbody>
      </table>
    </div>
    <div class="ws-pager">
      <button id="ws-prev" class="ws-btn" type="button">Previous</button>
      <span id="ws-count" class="ws-count" role="status"></span>
      <button id="ws-next" class="ws-btn" type="button">Next</button>
      <span id="ws-status" class="ws-status" role="status" aria-live="polite"></span>
      <button id="ws-view-progress" class="ws-btn" type="button" hidden>View progress</button>
    </div>
  </section>
  <section class="ws-lower" aria-label="Details">
    <div id="ws-detail" class="ws-detail">
      <p class="ws-prompt">Select a row above to review its details.</p>
    </div>
  </section>
</main>
<dialog id="ws-modal" class="ws-modal" aria-labelledby="ws-modal-title">
  <div class="ws-modal-head">
    <h2 id="ws-modal-title" class="ws-modal-title">Record</h2>
    <button id="ws-modal-close" class="ws-btn" type="button">Close</button>
  </div>
  <div id="ws-modal-body" class="ws-modal-body"></div>
  <div id="ws-operation" class="ws-modal-body ws-operation" aria-live="polite" hidden></div>
</dialog>
<div hidden>{% csrf_token %}</div>
<script src="{% static 'core/workspace.js' %}" defer></script>
</body>
</html>
